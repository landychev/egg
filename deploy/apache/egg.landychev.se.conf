# Egg Catcher – egg.landychev.se
# Installeras som /etc/apache2/sites-available/egg.landychev.se.conf.
# Kräver: a2enmod headers ssl. HTTPS-blocket aktiveras automatiskt när
# Let's Encrypt-certifikatet finns; före dess svarar bara port 80.
# Kontrollera apache2ctl -S så att ingen annan fil redan har domänen.

Define EGG_CERT /etc/letsencrypt/live/egg.landychev.se/fullchain.pem
Define EGG_KEY  /etc/letsencrypt/live/egg.landychev.se/privkey.pem

# Katalogregler är sökvägsbaserade och gäller båda vhostarna.
<Directory /var/www/egg>
    Options -Indexes +FollowSymLinks -ExecCGI -Includes
    AllowOverride None
    Require all denied
</Directory>
<Directory /var/www/egg/current>
    Require all granted
</Directory>
<Directory /var/www/egg/bootstrap>
    Require all granted
</Directory>
<Directory /var/www/egg/releases>
    Require all granted
</Directory>

<VirtualHost *:80>
    ServerName egg.landychev.se
    DocumentRoot /var/www/egg/current
    DirectoryIndex index.html
    Alias /releases/ /var/www/egg/releases/

    <IfFile ${EGG_CERT}>
        # Certifikat finns: skicka allt utom ACME-utmaningar till HTTPS.
        RedirectMatch permanent "^/(?!\.well-known/acme-challenge/)(.*)$" "https://egg.landychev.se/$1"
    </IfFile>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Cache-Control "no-store"
    <Location /releases/>
        Header always set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} < 400"
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/egg-error.log
    CustomLog ${APACHE_LOG_DIR}/egg-access.log combined
</VirtualHost>

<IfFile ${EGG_CERT}>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName egg.landychev.se
    DocumentRoot /var/www/egg/current
    DirectoryIndex index.html
    # Varje bygge har egna adresser så öppna sessioner överlever en uppdatering.
    Alias /releases/ /var/www/egg/releases/

    SSLEngine on
    SSLCertificateFile ${EGG_CERT}
    SSLCertificateKeyFile ${EGG_KEY}
    Include /etc/letsencrypt/options-ssl-apache.conf

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    # Färsk startsida och version.json; unikt namngivna versionsfiler får cachas.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Cache-Control "no-store"
    <Location /releases/>
        Header always set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} < 400"
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/egg-error.log
    CustomLog ${APACHE_LOG_DIR}/egg-access.log combined
</VirtualHost>
</IfModule>
</IfFile>
