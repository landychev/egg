# Enable only after inspecting apache2ctl -S and checking for an existing egg vhost.
# Certbot --apache adds HTTPS to this hostname after DNS and HTTP are verified.
<VirtualHost *:80>
    ServerName egg.landychev.se
    DocumentRoot /srv/egg/current
    DirectoryIndex index.html

    # Each build has its own URLs so open sessions survive a deployment.
    Alias /releases/ /srv/egg/releases/

    <Directory /srv/egg>
        Options -Indexes +FollowSymLinks -ExecCGI -Includes
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /srv/egg/current>
        Require all granted
    </Directory>
    <Directory /srv/egg/bootstrap>
        Require all granted
    </Directory>
    <Directory /srv/egg/releases>
        Require all granted
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Fresh root HTML and metadata; uniquely named release files can be cached.
    Header always set X-Content-Type-Options "nosniff"
    Header always set Cache-Control "no-store"
    <Location /releases/>
        Header always set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_STATUS} < 400"
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/egg-error.log
    CustomLog ${APACHE_LOG_DIR}/egg-access.log combined
</VirtualHost>
